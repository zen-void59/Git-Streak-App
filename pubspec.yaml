name: moss_app
description: "Track your GitHub coding streaks with Moss."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  http: ^1.2.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  provider: ^6.1.2
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  flutter_secure_storage: ^9.0.0
  app_links: ^6.0.2

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/screen.png
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_background: "#26A641"

flutter_native_splash:
  color: "#0D1117"
  image: assets/logo.png
  android_12:
    color: "#0D1117"
    image: assets/logo.png
